name: Build paper

on:
  push:
    branches: [main]
    paths-ignore: ["paper.pdf", "data/**", "paper/tables/**", "paper/figures/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the analysis (downloads data, estimates models, writes tables & figures)
        run: |
          pip install -r requirements.txt
          python analysis.py

      - name: Compile the paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper.tex
          working_directory: paper

      - name: Commit results
        run: |
          sudo cp paper/paper.pdf paper.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper.pdf data paper/tables paper/figures
          git diff --staged --quiet || git commit -m "Build paper and results"
          git push
